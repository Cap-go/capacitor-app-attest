name: PR beta publish prompt

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to refresh the beta publish comment for
        required: true
        type: number

concurrency:
  group: pr-beta-prompt-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # Keep this job capped at 10 minutes; never raise it unless explicitly asked.
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: Upsert beta publish comment
        uses: actions/github-script@v9
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const marker = '<!-- pr-beta-publish -->';
            let pr = context.payload.pull_request;

            if (!pr && process.env.DISPATCH_PR_NUMBER) {
              const prNumber = Number(process.env.DISPATCH_PR_NUMBER);
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              pr = data;
            }

            if (!pr) {
              core.setFailed('No pull request found for this workflow run.');
              return;
            }

            const sameRepo = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;

            const body = sameRepo
              ? [
                  marker,
                  '',
                  '## Beta npm build',
                  '',
                  'Maintainers can publish this PR to npm for fast testing.',
                  '',
                  'Comment `/publish-beta` after the PR checks are green.',
                  '',
                  'The workflow will:',
                  '- publish a prerelease package on the `beta` tag',
                  `- add a pinned \`pr-${pr.number}\` dist-tag for this exact PR build`,
                  '- update this comment with the install command',
                  '',
                  'Security note: beta publish is only enabled for branches inside this repository.',
                ].join('\n')
              : [
                  marker,
                  '',
                  '## Beta npm build',
                  '',
                  'This PR comes from a fork, so beta publish is disabled for security.',
                  '',
                  'If you need a beta package, move the branch into this repository first.',
                ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.user.type === 'Bot' && comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body,
            });
